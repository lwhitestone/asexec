name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      python-versions:
        description: JSON list of Python versions the test matrix (and release smoke) covers
        value: ${{ jobs.python-matrix.outputs.versions }}

permissions:
  contents: read

jobs:
  # Single source of truth for supported Python versions; publish.yml reuses it.
  python-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - id: set
        run: echo 'versions=["3.11", "3.12"]' >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    needs: [lint, python-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install (with dev extras)
        run: uv sync --all-extras --dev

      - name: Run tests (offline — drand round is baked as a fixture)
        run: uv run pytest -q

      - name: CLI smoke
        run: |
          uv run asexec --version
          uv run asexec keygen --out /tmp/ci.key
          uv run asexec prereg --key /tmp/ci.key --subject src --due 2099-01-01T00:00:00Z \
            --target "model m via provider p" --out /tmp/pre.json
          uv run asexec verify /tmp/pre.json --tests BDR

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/