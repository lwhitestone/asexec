[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project]
name = "asexec"
version = "0.3.8"
description = "Pre-registration & notarization primitive for AI evaluations — commit-then-reveal receipts so silence becomes evidence"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Luke Whitestone" }]
keywords = ["ai-safety", "evaluations", "pre-registration", "attestation", "cryptography", "notarization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pynacl>=1.5",   # ed25519 signing/verification
    "py_ecc>=6.0",   # BLS12-381 verification for drand quicknet freshness anchor
    "pydantic>=2",   # typed manifest construction/validation
]

[project.optional-dependencies]
blake3 = ["blake3>=0.3"]   # optional alternative content-hash algorithm

[project.scripts]
asexec = "asexec.cli:main"

[project.urls]
Homepage = "https://github.com/lwhitestone/asexec"
Issues = "https://github.com/lwhitestone/asexec/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
 
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.uv.workspace]
members = [
    ".",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.6",
]
